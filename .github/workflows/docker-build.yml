name: Docker build on push
env:
  DOCKER_CLI_EXPERIMENTAL: enabled

on:
  release:
    types: [published]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and push sphinx swarm image
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true
    steps:
      - name: Check out from Git
        uses: actions/checkout@v2
      - name: Test env
        run: echo "RELEASE_TAG=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
      - name: Test print env
        run: |
          echo $RELEASE_TAG
          echo ${{ env.RELEASE_TAG }}
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
      - name: Checkout project
        uses: actions/checkout@v2
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Run Build
        working-directory: ./app
        run: |
          yarn install
          yarn run build
      - name: Setup Docker buildx action
        uses: docker/setup-buildx-action@v3
        id: buildx
      - name: Show available buildx platforms
        run: echo ${{ steps.buildx.outputs.platforms }}
      - name: Cache Docker layers
        uses: actions/cache@v4
        id: cache
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: Test print env
        run: |
          echo $RELEASE_TAG
          echo ${{ env.RELEASE_TAG }}
      - name: Run Docker buildx
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            docker buildx build \
            -f src/bin/stack/Dockerfile \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --build-arg CARGO_PROFILE_RELEASE_OPT_LEVEL=0 \
            --no-cache \
            --platform linux/amd64 ./
          else
            docker buildx build \
            -f src/bin/stack/Dockerfile \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --cache-to "type=local,dest=/tmp/.buildx-cache" \
            --platform linux/amd64 \
            --tag "${{ secrets.DOCKER_HUB_USER }}/sphinx-swarm:${{ env.RELEASE_TAG }}" \
            --tag "${{ secrets.DOCKER_HUB_USER }}/sphinx-swarm:latest" \
            --output "type=registry" ./
          fi
      - name: Get image digest
        if: github.event_name != 'pull_request'
        id: digest
        run: echo "digest=$(docker buildx imagetools inspect "${{ secrets.DOCKER_HUB_USER }}/sphinx-swarm:${{ env.RELEASE_TAG }}" --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"
      # Verify with: gh attestation verify oci://index.docker.io/<namespace>/sphinx-swarm@sha256:<digest> --owner stakwork
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: index.docker.io/${{ secrets.DOCKER_HUB_USER }}/sphinx-swarm
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
  build_superadmin:
    runs-on: ubuntu-latest
    name: Build and push superadmin image
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true
    steps:
      - name: Check out from Git
        uses: actions/checkout@v2
      - name: Test env
        run: echo "RELEASE_TAG=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
      - name: Test print env
        run: |
          echo $RELEASE_TAG
          echo ${{ env.RELEASE_TAG }}
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
      - name: Checkout project
        uses: actions/checkout@v2
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Run Swarm Build
        working-directory: ./app
        run: |
          yarn install
          yarn run build
      - name: Run Build
        working-directory: ./src/bin/super/superapp
        run: |
          yarn install
          yarn run build
      - name: Setup Docker buildx action
        uses: docker/setup-buildx-action@v3
        id: buildx
      - name: Show available buildx platforms
        run: echo ${{ steps.buildx.outputs.platforms }}
      - name: Cache Docker layers
        uses: actions/cache@v4
        id: cache
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: Test print env
        run: |
          echo $RELEASE_TAG
          echo ${{ env.RELEASE_TAG }}
      - name: Run Docker buildx
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            docker buildx build \
            -f src/bin/super/Dockerfile \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --build-arg CARGO_PROFILE_RELEASE_OPT_LEVEL=0 \
            --no-cache \
            --platform linux/amd64 ./
          else
            docker buildx build \
            -f src/bin/super/Dockerfile \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --cache-to "type=local,dest=/tmp/.buildx-cache" \
            --platform linux/amd64 \
            --tag "${{ secrets.DOCKER_HUB_USER }}/sphinx-swarm-superadmin:${{ env.RELEASE_TAG }}" \
            --tag "${{ secrets.DOCKER_HUB_USER }}/sphinx-swarm-superadmin:latest" \
            --output "type=registry" ./
          fi
      - name: Get image digest
        if: github.event_name != 'pull_request'
        id: digest
        run: echo "digest=$(docker buildx imagetools inspect "${{ secrets.DOCKER_HUB_USER }}/sphinx-swarm-superadmin:${{ env.RELEASE_TAG }}" --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"
      # Verify with: gh attestation verify oci://index.docker.io/<namespace>/sphinx-swarm-superadmin@sha256:<digest> --owner stakwork
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: index.docker.io/${{ secrets.DOCKER_HUB_USER }}/sphinx-swarm-superadmin
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
