global:
  scrape_interval: 10s

scrape_configs:
  - job_name: 'swarms'
    ec2_sd_configs:
      - region: us-east-1
        port: 9100
    scheme: http  # Ensure Prometheus uses HTTP
    relabel_configs:
      # Keep only the EC2 instances with the tag Swarm set to superadmin
      - source_labels: [__meta_ec2_tag_Swarm]
        regex: superadmin
        action: keep

      # Extract the public IP from EC2 metadata and assign it to __address__
      - source_labels: [__meta_ec2_public_ip]
        regex: (.*)
        target_label: __address__
        replacement: "${1}:9100"

      # Label the instances with their name and availability zone
      - source_labels: [__meta_ec2_tag_Name, __meta_ec2_availability_zone]
        target_label: instance

  # Fluent Bit HTTP_Server /api/v1/metrics — dropped records from the Lua
  # filter and global throttle. Sidecar listens on 2020; must not use the
  # fluentd log driver (json-file with rotation only).
  - job_name: 'fluent-bit'
    ec2_sd_configs:
      - region: us-east-1
        port: 2020
    metrics_path: /api/v1/metrics
    scheme: http
    relabel_configs:
      - source_labels: [__meta_ec2_tag_Swarm]
        regex: superadmin
        action: keep

      - source_labels: [__meta_ec2_public_ip]
        regex: (.*)
        target_label: __address__
        replacement: "${1}:2020"

      - source_labels: [__meta_ec2_tag_Name, __meta_ec2_availability_zone]
        target_label: instance