# docker-compose -f second-brain-2.yml up sphinx-swarm -d

version: "2"

services:
  load_balancer:
    image: traefik:v2.11.31
    container_name: load_balancer
    restart: unless-stopped
    networks:
      - sphinx-swarm
    command:
      # - "--log.level=DEBUG"
      # - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.directory=/certs"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.mqttsecure.address=:8883"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # individual services (match filter_out_reserved_ports_if_using_port_based_ssl)
      - "--entrypoints.port7799.address=:7799"
      - "--entrypoints.port3355.address=:3355"
      - "--entrypoints.port6000.address=:6000"
      - "--entrypoints.port8000.address=:8000"
      - "--entrypoints.port3100.address=:3100"
      - "--entrypoints.port8444.address=:8444"
      - "--entrypoints.port8800.address=:8800"
      - "--entrypoints.port9000.address=:9000"
      - "--entrypoints.port3333.address=:3333"
      - "--entrypoints.port8181.address=:8181"
    ports:
      # The HTTP port
      - 80:80
      # The Web UI (enabled by --api.insecure=true)
      # - 8080:8080
      # entrypoints
      - 443:443
      - 8883:8883
      # individual services
      - 7799:7799 # stakgraph
      - 3355:3355 # repo2graph
      - 6000:6000 # jarvis
      - 8000:8000 # navfiber
      - 3100:3100 # graphmindset
      - 8444:8444 # boltwall
      - 8800:8800 # swarm
      - 9000:9000 # vector
      - 3333:3333 # hive-relay
      - 8181:8181 # bifrost
    volumes:
      # So that Traefik can listen to the Docker events
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/admin/certs:/certs

  sphinx-swarm:
    image: sphinxlightning/sphinx-swarm
    container_name: sphinx-swarm
    # Recreate this container (not just image-bump) so the fluent-bit network
    # attach and Traefik network pin take effect.
    networks:
      - sphinx-swarm
      - fluent-bit
    depends_on:
      - load_balancer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/admin/vol:/vol
      - /home/admin/sphinx-swarm/.env:/.env
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=sphinx-swarm"
      - "traefik.http.routers.elements.rule=Host(`${HOST}`)"
      - "traefik.http.services.elements.loadbalancer.server.port=8800"
      - "traefik.http.routers.elements.tls=true"
      - "traefik.http.routers.elements.entrypoints=port8800"
    restart: unless-stopped
    environment:
      - HOST=$HOST # subdomain e.g. swarmx.sphinx.chat
      - DOCKER_RUN=true # client use sphinx-swarm network
      - PORT_BASED_SSL=1
      - NETWORK=bitcoin
      - ROCKET_ADDRESS=0.0.0.0
      - ROCKET_PORT=8800
      - AWS_REGION=$AWS_REGION
      - STAKWORK_ADD_NODE_TOKEN=$STAKWORK_ADD_NODE_TOKEN
      - STAKWORK_RADAR_REQUEST_TOKEN=$STAKWORK_RADAR_REQUEST_TOKEN
      - SECOND_BRAIN_ONLY=$SECOND_BRAIN_ONLY
      - GRAPH_MINDSET_ONLY=$GRAPH_MINDSET_ONLY
      - CLN_MAINNET_BTC=$CLN_MAINNET_BTC
      - SEED=$SEED
      - EXTERNAL_LND_ADDRESS=$EXTERNAL_LND_ADDRESS
      - EXTERNAL_LND_MACAROON=$EXTERNAL_LND_MACAROON
      - EXTERNAL_LND_CERT=$EXTERNAL_LND_CERT
      - TWEET_BY_AUTOR_WORKFLOW_ID=$TWEET_BY_AUTOR_WORKFLOW_ID
      - YOUTUBE_API_TOKEN=$YOUTUBE_API_TOKEN
      - SECOND_BRAIN_GRAPH_URL=$SECOND_BRAIN_GRAPH_URL
      - RADAR_SCHEDULER_TIME_IN_SEC=$RADAR_SCHEDULER_TIME_IN_SEC
      - RADAR_YOUTUBE_SCHEDULER_TIME_IN_SEC=$RADAR_YOUTUBE_SCHEDULER_TIME_IN_SEC
      - RADAR_TWITTER_SCHEDULER_TIME_IN_SEC=$RADAR_TWITTER_SCHEDULER_TIME_IN_SEC
      - NAV_BOLTWALL_SHARED_HOST=$NAV_BOLTWALL_SHARED_HOST
      - SWARM_UPDATER_PASSWORD=$SWARM_UPDATER_PASSWORD
      - JARVIS_FEATURE_FLAG_SCHEMA=$JARVIS_FEATURE_FLAG_SCHEMA
      - JARVIS_FEATURE_FLAG_WFA_SCHEMAS=$JARVIS_FEATURE_FLAG_WFA_SCHEMAS
      - BACKUP_KEY=$BACKUP_KEY
      - BACKUP=$BACKUP
      - SUPER_TOKEN=$SUPER_TOKEN
      - FEATURE_FLAG_TEXT_EMBEDDINGS=$FEATURE_FLAG_TEXT_EMBEDDINGS
      - RADAR_RSS_SCHEDULER_TIME_IN_SEC=$RADAR_RSS_SCHEDULER_TIME_IN_SEC
      - RADAR_YOUTUBE_SCHEDULER_JOB=$RADAR_YOUTUBE_SCHEDULER_JOB
      - RADAR_TWITTER_SCHEDULER_JOB=$RADAR_TWITTER_SCHEDULER_JOB
      - RADAR_TOPIC_SCHEDULER_JOB=$RADAR_TOPIC_SCHEDULER_JOB
      - MAX_PAYMENT_HIERARCY_DEPTH=$MAX_PAYMENT_HIERARCY_DEPTH
      - DYNAMO_DB_AWS_ACCESS_KEY_ID=$DYNAMO_DB_AWS_ACCESS_KEY_ID
      - DYNAMO_DB_AWS_REGION=$DYNAMO_DB_AWS_REGION
      - DYNAMO_DB_AWS_SECRET_ACCESS_KEY=$DYNAMO_DB_AWS_SECRET_ACCESS_KEY
      - WEBPAGE_TEXT_WORKFLOW_ID=$WEBPAGE_TEXT_WORKFLOW_ID
      - SUPER_URL=$SUPER_URL
      - LOCAL_LLAMA=$LOCAL_LLAMA
      - QUESTION_AND_ANSWER_WORKFLOW_ID=$QUESTION_AND_ANSWER_WORKFLOW_ID
      - AWS_S3_BUCKET_NAME=$AWS_S3_BUCKET_NAME
      - GITHUB_REQUEST_TOKEN=$GITHUB_REQUEST_TOKEN
      - SINGLE_AUDIO_OR_VIDEO_EPISODE_WORKFLOW_ID=$SINGLE_AUDIO_OR_VIDEO_EPISODE_WORKFLOW_ID
      - JARVIS_FEATURES=$JARVIS_FEATURES
      - JARVIS_SINGLE_TWEET_WORKFLOW_ID=$JARVIS_SINGLE_TWEET_WORKFLOW_ID
      - JARVIS_FEATURE_FLAG_CODEGRAPH_SCHEMAS=$JARVIS_FEATURE_FLAG_CODEGRAPH_SCHEMAS
      - RADAR_TOPIC_SCHEDULER_TIME_IN_SEC=$RADAR_TOPIC_SCHEDULER_TIME_IN_SEC
      - ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY
      - OPENAI_API_KEY=$OPENAI_API_KEY
      - GITHUB_PAT=$GITHUB_PAT
      - PASSWORD=$PASSWORD
      - SWARM_NUMBER=$SWARM_NUMBER
      - BOLTWALL_API_SECRET=$BOLTWALL_API_SECRET
      - CERT_BUCKET=$CERT_BUCKET
      - CONTENT_WORKFLOW_ID=$CONTENT_WORKFLOW_ID
      - LEGAL_CLASSIFIER_WORKFLOW_ID=$LEGAL_CLASSIFIER_WORKFLOW_ID
      - GRAPHMINDSET_STAKWORK_WORKFLOW_ID=$GRAPHMINDSET_STAKWORK_WORKFLOW_ID
      - CHECK_PUBLIC_IP_CRON=$CHECK_PUBLIC_IP_CRON
      - ROUTER_URL=$ROUTER_URL
      - OPENROUTER_API_KEY=$OPENROUTER_API_KEY
      - GUNICORN_WORKER=$GUNICORN_WORKER
      - GUNICORN_THREADS=$GUNICORN_THREADS
      - HF_TOKEN=$HF_TOKEN
  node_exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: node_exporter
    command:
      - "--path.rootfs=/host"
    network_mode: host
    pid: host
    restart: unless-stopped
    volumes:
      - "/:/host:ro,rslave"

  # Rate-limiting log sidecar. Host Docker fluentd driver ships managed-container
  # logs to 127.0.0.1:24224; this service must NOT join sphinx-swarm (DEFAULT_NETWORK)
  # so co-networked containers cannot reach the unauthenticated Forward input.
  # Sidecar MUST use json-file with rotation — never the fluentd driver — or
  # [rate_limit] notices / throttle Print_Status on stdout would loop into INPUT 24224.
  fluent_bit:
    image: fluent/fluent-bit:3.2.10
    container_name: fluent_bit
    restart: unless-stopped
    networks:
      fluent-bit:
        aliases:
          - fluentbit
    ports:
      # Loopback only. Docker fluentd-address=localhost:24224 resolves here.
      # Do not bind 0.0.0.0 — Forward input is unauthenticated.
      - "127.0.0.1:24224:24224"
      # HTTP_Server /api/v1/metrics (dropped-record signal). Loopback so it is
      # not on a public interface; these hosts already publish 80/443/8883.
      - "127.0.0.1:2020:2020"
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./fluent-bit/rate_limit.lua:/fluent-bit/etc/rate_limit.lua:ro
      - fluent-bit-storage:/var/log/flb-storage
    environment:
      # Written to host .env by provisioning; required so log_group_name
      # /swarms/${SWARM_NUMBER} in fluent-bit.conf does not resolve empty.
      - SWARM_NUMBER=$SWARM_NUMBER
      # Passed for tooling consistency. CloudWatch output region is hardcoded
      # us-east-1 in fluent-bit.conf (matches Environment::Cloud / awslogs-region).
      - AWS_REGION=$AWS_REGION
      - FLUENTBIT_RATE_LIMIT_INTERVAL=${FLUENTBIT_RATE_LIMIT_INTERVAL:-3600}
      - FLUENTBIT_RATE_LIMIT_BYTES=${FLUENTBIT_RATE_LIMIT_BYTES:-67108864}
      - FLUENTBIT_RATE_LIMIT_BYTE_OVERRIDES=${FLUENTBIT_RATE_LIMIT_BYTE_OVERRIDES:-repo2graph.sphinx=1073741824,boltwall.sphinx=268435456}
      - FLUENTBIT_RATE_LIMIT_DEFAULT=${FLUENTBIT_RATE_LIMIT_DEFAULT:-500000}
      - FLUENTBIT_RATE_LIMIT_OVERRIDES=${FLUENTBIT_RATE_LIMIT_OVERRIDES:-repo2graph.sphinx=8000000}
      - FLUENTBIT_RATE_LIMIT_MAX_KEYS=${FLUENTBIT_RATE_LIMIT_MAX_KEYS:-256}
      # AWS credentials: IMDS/instance role is preferred and default.
      # The host awslogs driver used the daemon's EC2 role; cloudwatch_logs in
      # this container does not inherit that. The sidecar reaches IMDS at
      # 169.254.169.254 (same aws_config::from_env() chain as
      # make_cloudwatch_logs_client). If IMDSv2 hop-limit is 1, raise it to 2
      # on the instance so containers can assume the role.
      # Static keys only from a secret store if IMDS is unreachable — never
      # commit real values:
      # - AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
      # - AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  sphinx-swarm:
    external: true
  # Dedicated bridge for the sidecar only. Not sphinx-swarm: managed containers
  # cannot DNS-resolve or reach fluent_bit:24224. Outbound (CloudWatch + IMDS)
  # remains available — do not set internal: true.
  fluent-bit:
    name: fluent-bit
    driver: bridge

volumes:
  fluent-bit-storage:
