[SERVICE]
    Flush          1
    Daemon         Off
    # Keep non-debug in production so verbose status cannot surface
    # secret-bearing application log lines.
    Log_Level      info
    # Expose /api/v1/metrics so Prometheus can see records dropped by the
    # Lua filter and the global throttle. HTTP_Server Off would hide the
    # only signal that data is being destroyed.
    HTTP_Server    On
    HTTP_Listen    0.0.0.0
    HTTP_Port      2020
    # Filesystem chunk store. When CloudWatch stalls (throttle, expired
    # creds, network) the forward input must not grow RAM until OOM —
    # a dead sidecar plus fluentd-async=true silently discards into the
    # daemon's 1 MiB buffer. With storage.type filesystem, Mem_Buf_Limit
    # is ignored; memory is storage.max_chunks_up (25 × ~2 MB ≈ 50 MB).
    # pause_on_chunks_overlimit stops the input instead of writing disk
    # unboundedly. Output storage.total_limit_size drops oldest chunks.
    storage.path              /var/log/flb-storage/
    storage.sync              normal
    storage.checksum          off
    storage.backlog.mem_limit 5M
    storage.max_chunks_up     25

# Sidecar MUST use Docker json-file logging with rotation, never the fluentd
# driver. [rate_limit] notices and throttle Print_Status go to fluent-bit
# stdout; sending that through fluentd would loop into this INPUT.
#   logging:
#     driver: json-file
#     options:
#       max-size: "10m"
#       max-file: "3"

# Per-container cap is enforced by rate_limit.lua using hourly budgets
# (short windows cannot tell a healthy 15k/s burst from a loop):
#   FLUENTBIT_RATE_LIMIT_INTERVAL         seconds (default 3600)
#   FLUENTBIT_RATE_LIMIT_BYTES            bytes of record.log per interval
#                                         (primary; default 67108864 = 64 MiB/hr)
#   FLUENTBIT_RATE_LIMIT_BYTE_OVERRIDES   name=integer (byte-cap map;
#                                         repo2graph.sphinx=1073741824)
#   FLUENTBIT_RATE_LIMIT_DEFAULT          records per interval (secondary;
#                                         default 500000)
#   FLUENTBIT_RATE_LIMIT_OVERRIDES        name=integer (record-cap map;
#                                         repo2graph.sphinx=8000000)
#   FLUENTBIT_RATE_LIMIT_MAX_KEYS         distinct-key bound (default 256)
# Keying uses the Docker-daemon-set container_name record field, NOT the
# fluentd tag (FLUENTD_TAG is operator-overridable and a static value would
# collapse every container into one bucket).

[INPUT]
    Name           forward
    Listen         0.0.0.0
    Port           24224
    # filesystem storage ignores Mem_Buf_Limit. memory = SERVICE
    # storage.max_chunks_up. Pause (backpressure the Docker fluentd
    # driver) when that is exceeded instead of writing disk forever.
    storage.type                      filesystem
    storage.pause_on_chunks_overlimit On

# Primary per-container cap. The Lua filter runs single-threaded in the
# main pipeline, which is what serializes the counters. OUTPUT workers 1
# does NOT provide Lua-state thread-safety.
[FILTER]
    Name   lua
    Match  *
    # Compose must mount rate_limit.lua here (official image config dir).
    # Relative names resolve from process CWD, which is / in the image.
    script /fluent-bit/etc/rate_limit.lua
    call   rate_limit

# Defense-in-depth global aggregate ceiling. Even if per-container keying
# is evaded (e.g. tag/name-field rotation producing unbounded distinct
# keys), this bounds total CloudWatch ingestion.
# Print_Status emits only counts, never record bodies — and only to
# fluent-bit stdout (json-file). Never ship this sidecar with the fluentd
# log driver.
[FILTER]
    Name         throttle
    Match        *
    Rate         5000
    Window       5
    Interval     1s
    Print_Status On

[OUTPUT]
    Name  cloudwatch_logs
    Match *
    # Hardcoded us-east-1 to match Environment::Cloud in src/utils.rs
    # (awslogs-region = "us-east-1" as a literal, independent of AWS_REGION).
    # Sourcing region from the operator-overridable AWS_REGION would split
    # throttled logs into a different region than today's dashboards.
    region us-east-1
    # SWARM_NUMBER must be passed into the fluent_bit container (it is
    # written to the host .env by the provisioning script, not compose).
    # Do not use SWARM_ID — that variable does not exist in this codebase.
    log_group_name /swarms/${SWARM_NUMBER}
    # Match existing /swarms/* group retention (7 days).
    log_retention_days  7
    # Bare container_name stream (matches awslogs tag={{.Name}}).
    # Do not prefix with SWARM_NUMBER — each swarm runs its own sidecar
    # writing to its own /swarms/{SWARM_NUMBER} group, so cross-swarm
    # stream collisions cannot occur, and changing the stream name would
    # break existing dashboard queries.
    # Record-accessor template (not log_stream_prefix, which appends the
    # fluentd tag and would follow FLUENTD_TAG instead of container_name).
    log_stream_template $container_name
    auto_create_group   On
    # Docker's fluentd driver wraps the message in a `log` field.
    log_key  log
    # workers 1 governs the output stage only. It does not serialize Lua
    # filter state; the Lua filter is already single-threaded in the main
    # pipeline.
    workers  1
    # Cap on-disk chunks for this output. When CloudWatch cannot drain,
    # oldest chunks are dropped rather than filling the disk.
    storage.total_limit_size  100M
    # Local testing only (e.g. LocalStack). Leave unset/empty in production.
    # Never hardcode a non-CloudWatch endpoint — a committed endpoint would
    # silently redirect production logs (and the credentials used to send
    # them) to a dev sink. Fluent Bit cannot omit a key when the env var is
    # empty, so this must stay commented unless FLUENTBIT_CW_ENDPOINT is
    # deliberately set for a local test run.
    # endpoint ${FLUENTBIT_CW_ENDPOINT}
